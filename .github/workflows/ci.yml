name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Unit tests (no GPU required)
        run: |
          python tests/test_climate.py
          python tests/test_cooling.py
          python tests/test_themes_and_config.py
          python tests/test_graphs.py
      - name: CLI smoke
        run: |
          zionstats --version
          zionstats --list-themes
          zionstats --demo --snapshot | python -m json.tool > /dev/null
