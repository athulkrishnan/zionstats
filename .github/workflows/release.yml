name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])' 2>/dev/null \
            || python -c 'import tomli; print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG_VERSION pyproject=$PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != pyproject $PYPROJECT_VERSION -- bump one of them"
            exit 1
          fi

  rust-binaries:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, name: linux_amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, name: linux_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p zionstats-daemon -p zionstats-tui -p zionstats
          mkdir -p release
          for bin in zionstats zionstatsd zionstats-tui; do
            cp "target/${{ matrix.target }}/release/$bin" release/
          done
      - name: Smoke
        run: ./release/zionstatsd --version && ./release/zionstats-tui --version
      - name: Zip
        shell: python
        run: |
          import os, zipfile
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          target = "${{ matrix.name }}"
          with zipfile.ZipFile(f"release/zionstats_{version}_{target}_rust.zip", "w",
                               zipfile.ZIP_DEFLATED) as z:
              for bin in ("zionstats", "zionstatsd", "zionstats-tui"):
                  z.write(f"release/{bin}", bin)
              for f in ("README.md", "LICENSE", "NOTICE", "CHANGELOG.md"):
                  z.write(f, f)
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.name }}
          path: release/*

  python-packages:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  publish-pypi:
    needs: [python-packages, version-check]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux_amd64 }
          - { os: ubuntu-22.04-arm, target: linux_arm64 }
          # intel-mac (macos-13) omitted: runner pool is starved; macOS Intel
          # users are covered by the pure-python wheel via pip
          - { os: macos-14, target: macOS_arm64 }
          - { os: windows-2022, target: windows_amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          pip install . pyinstaller
        env:
          PIP_EXTRA_INDEX_URL: ""
      - name: Install windows-curses (windows only)
        if: runner.os == 'Windows'
        run: pip install windows-curses
      - name: Build binary
        run: pyinstaller --onefile --name zionstats --clean -y run.py
      - name: Smoke (POSIX)
        if: runner.os != 'Windows'
        run: ./dist/zionstats --version
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: dist\zionstats.exe --version
      - name: Zip
        shell: python
        run: |
          import os, shutil, zipfile
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          target = "${{ matrix.target }}"
          os.makedirs("release", exist_ok=True)
          exe = "dist/zionstats.exe" if os.path.exists("dist/zionstats.exe") else "dist/zionstats"
          with zipfile.ZipFile(f"release/zionstats_{version}_{target}.zip", "w",
                               zipfile.ZIP_DEFLATED) as z:
              z.write(exe, os.path.basename(exe))
          for f in ("README.md", "LICENSE", "NOTICE", "CHANGELOG.md"):
              shutil.copy(f, "release/")
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: release/*

  publish:
    needs: [python-packages, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f | while read f; do cp "$f" release/ 2>/dev/null || true; done
          cd release
          sha256sum * > checksums.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.whl
            release/*.tar.gz
            release/checksums.txt
          body: |
            See [CHANGELOG.md](https://github.com/athulkrishnan/zionstats/blob/main/CHANGELOG.md).

            Prefer pip? `pip install zionstats` (from PyPI) or
            `pip install git+https://github.com/athulkrishnan/zionstats.git`.

            Binaries are self-contained (bundled Python). They still need the
            **NVIDIA driver** for live metrics; without a GPU use `--demo`.
            Prebuilt targets: linux amd64/arm64, macOS arm64, windows amd64.
            macOS Intel and other platforms: `pip install` from source.
