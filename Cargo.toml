[workspace]
resolver = "2"
members = [
    "crates/zionstats-core",
    "crates/zionstats-daemon",
    "crates/zionstats-tui",
    "crates/zionstats",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Athul Krishnan"]
repository = "https://github.com/athulkrishnan/zionstats"
rust-version = "1.75"

[workspace.dependencies]
zionstats-core = { path = "crates/zionstats-core" }
zionstats-daemon = { path = "crates/zionstats-daemon" }
zionstats-tui = { path = "crates/zionstats-tui" }
zerocopy = { version = "0.8", features = ["derive"] }
nvml-wrapper = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
sd-notify = "0.4"
memmap2 = "0.9"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
libc = "0.2"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
