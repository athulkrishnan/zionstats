[workspace]
resolver = "2"
# the Rust core lives canonically in zionstats-rs; this repo pins it as a
# git dependency at tag v0.7.0 and ships only the thin shell crate whose
# three bins (zionstats, zionstatsd, zionstats-tui) mirror the sibling's
# CLIs and exit codes
members = ["crates/zionstats"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Athul Krishnan"]
repository = "https://github.com/athulkrishnan/zionstats"
rust-version = "1.75"

[workspace.dependencies]
zionstats-core = { git = "https://github.com/athulkrishnan/zionstats-rs", tag = "v0.7.0", default-features = false }
zionstats-daemon = { git = "https://github.com/athulkrishnan/zionstats-rs", tag = "v0.7.0", default-features = false }
zionstats-tui = { git = "https://github.com/athulkrishnan/zionstats-rs", tag = "v0.7.0", default-features = false }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
